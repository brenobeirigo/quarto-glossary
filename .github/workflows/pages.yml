name: Publish manual

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "_extensions/glossary/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true
      # The demo lesson also renders to PDF.
      - name: Install LaTeX packages
        run: |
          tlmgr_path="$(find "$HOME" -name tlmgr -print -quit)"
          test -n "$tlmgr_path"
          tex_bin="$(dirname "$tlmgr_path")"
          echo "$tex_bin" >> "$GITHUB_PATH"
          "$tlmgr_path" update --self
          "$tlmgr_path" install glossaries glossaries-extra fontawesome5
      - uses: actions/configure-pages@v5
      - name: Render manual
        run: quarto render docs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy manual
        id: deployment
        uses: actions/deploy-pages@v4
